<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
</head>
<body>
  <a-scene physics="debug: false" xr-mode-ui="XRMode: vr">
    <a-sky color="#000"></a-sky>

    <a-entity id="right-hand" hand-controls="hand: right" static-body="shape: sphere; sphereRadius: 0.1">
      <a-sphere radius="0.1" visible="false"></a-sphere>
    </a-entity>
    <a-entity id="left-hand" hand-controls="hand: left" static-body="shape: sphere; sphereRadius: 0.1">
      <a-sphere radius="0.1" visible="false"></a-sphere>
    </a-entity>

    <a-entity id="target-container"></a-entity>
  </a-scene>

  <script>
    const container = document.querySelector('#target-container');

    function spawnTarget() {
      const isSix = Math.random() > 0.5;
      const target = document.createElement('a-text');
      
      target.setAttribute('value', isSix ? '6' : '9');
      target.setAttribute('class', isSix ? 'num6' : 'num9');
      target.setAttribute('position', `${(Math.random()-0.5)*4} ${1.6+(Math.random()-0.5)*2} -5`);
      
      // 충돌(글러브 터치) 감지 설정
      target.setAttribute('dynamic-body', 'shape: box');
      
      // 글러브(손)에 닿는 순간 감지
      target.addEventListener('collide', function(e) {
        const handId = e.detail.body.el.id; // 오른손/왼손 확인
        if ((isSix && handId === 'right-hand') || (!isSix && handId === 'left-hand')) {
          // 정답 처리
          this.remove();
        }
      });
      container.appendChild(target);
    }

    setInterval(spawnTarget, 2000);
  </script>
</body>
</html>
