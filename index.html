<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
</head>
<body>
  <a-scene physics="debug: false" xr-mode-ui="XRMode: vr">
    <a-sky color="#000"></a-sky>

    <a-entity id="right-hand" hand-controls="hand: right" static-body="shape: sphere; sphereRadius: 0.2"></a-entity>
    <a-entity id="left-hand" hand-controls="hand: left" static-body="shape: sphere; sphereRadius: 0.2"></a-entity>

    <a-entity id="target-container"></a-entity>
  </a-scene>

  <script>
    const container = document.querySelector('#target-container');

    function spawnPunchTarget() {
      const isSix = Math.random() > 0.5;
      const target = document.createElement('a-text');
      
      // 1. 숫자가 3D 공간 입체적으로 등장
      target.setAttribute('value', isSix ? '6' : '9');
      target.setAttribute('class', isSix ? 'num6' : 'num9');
      target.setAttribute('position', `${(Math.random()-0.5)*3} ${1.6+(Math.random()-0.5)*2} -8`);
      target.setAttribute('scale', '3 3 3'); // 펀치하기 좋게 크게 설정
      
      // 2. 훈련자 쪽으로 펀치를 유도하는 속도(4초에서 2초로 단축 - 빠른 타격감)
      target.setAttribute('dynamic-body', 'shape: box; mass: 0');
      target.setAttribute('animation', {
        property: 'position', to: '0 1.6 0', dur: 2500, easing: 'linear'
      });

      // 3. 펀치(충돌) 감지: 글러브가 닿으면 터짐
      target.addEventListener('collide', function(e) {
        const hand = e.detail.body.el.id;
        if ((isSix && hand === 'right-hand') || (!isSix && hand === 'left-hand')) {
          // 정답 시 타격감(사운드+삭제)
          playPunchSound(true);
          this.remove();
        } else {
          playPunchSound(false); // 틀리면 오답 사운드
        }
      });
      container.appendChild(target);
    }

    function playPunchSound(isSuccess) {
       // 타격 사운드 로직 (생략)
    }

    setInterval(spawnPunchTarget, 1500);
  </script>
</body>
</html>
