<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <a-scene xr-mode-ui="XRMode: vr" background="color: #000">
    <a-sky color="#000"></a-sky>
    <a-entity id="stars"></a-entity>

    <a-entity camera look-controls position="0 1.6 0"></a-entity>

    <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .num6;"></a-entity>
    <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .num9;"></a-entity>

    <a-entity id="target-container"></a-entity>
  </a-scene>

  <script>
    // 1. 배경 생성 (황금 별과 달)
    const starContainer = document.querySelector('#stars');
    for(let i=0; i<100; i++) {
        const star = document.createElement('a-entity');
        star.setAttribute('geometry', 'primitive: sphere; radius: 0.05');
        star.setAttribute('material', 'color: #FFD700');
        star.setAttribute('position', `${(Math.random()-0.5)*20} ${(Math.random()-0.5)*20} ${(Math.random()-0.5)*20}`);
        starContainer.appendChild(star);
    }

    // 2. 6과 9 생성 로직
    const container = document.querySelector('#target-container');
    function spawnTarget() {
      const isSix = Math.random() > 0.5;
      const target = document.createElement('a-text');
      
      target.setAttribute('value', isSix ? '6' : '9');
      target.setAttribute('class', isSix ? 'num6' : 'num9');
      target.setAttribute('align', 'center');
      target.setAttribute('scale', '2 2 2');
      target.setAttribute('color', '#FFD700');
      
      const angle = Math.random() * Math.PI * 2;
      const x = Math.cos(angle) * 8;
      const z = Math.sin(angle) * 8;
      target.setAttribute('position', `${x} 1.6 ${z}`);

      target.setAttribute('animation', {property: 'position', to: '0 1.6 0', dur: 4000, easing: 'linear'});

      // 터치 이벤트
      target.addEventListener('mousedown', function() {
        // 정답/오답 사운드 (간단한 비프음)
        playTone(isSix ? 880 : 440); // 6(오른손)은 높은음, 9(왼손)은 낮은음
        this.remove();
      });
      container.appendChild(target);
    }

    function playTone(freq) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }

    setInterval(spawnTarget, 2000);
  </script>
</body>
</html>
