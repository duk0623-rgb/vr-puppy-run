<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <a-scene xr-mode-ui="XRMode: vr" background="color: #000">
    
    <!-- 훈련자 카메라 -->
    <a-entity camera look-controls position="0 1.6 0"></a-entity>

    <!-- 컨트롤러(오른손): 레이저 조준 -->
    <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .target"></a-entity>

    <!-- 타겟이 생성될 곳 -->
    <a-entity id="target-container"></a-entity>

    <script>
      const container = document.querySelector('#target-container');

      function spawnTarget() {
        const target = document.createElement('a-sphere');
        
        // 1. 사방에서 날아오게 하기 위해 랜덤 각도 생성
        const angle = Math.random() * Math.PI * 2;
        const elevation = (Math.random() - 0.5) * 2; // 상하 높이
        const distance = 8; // 시작 거리

        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;
        const y = 1.6 + elevation;

        // 2. 타겟 속성 설정
        target.setAttribute('class', 'target');
        target.setAttribute('position', `${x} ${y} ${z}`);
        target.setAttribute('radius', '0.4');
        target.setAttribute('color', '#FF4757');

        // 3. 훈련자(중심)로 다가오는 애니메이션
        target.setAttribute('animation', {
          property: 'position',
          to: '0 1.6 0',
          dur: 3000, // 3초 동안 날아옴 (난이도 조절: 줄이면 빨라짐)
          easing: 'linear'
        });

        // 4. 터치(클릭) 이벤트
        target.addEventListener('click', function() {
          this.setAttribute('color', '#2ecc71'); // 터치 시 초록색으로
          setTimeout(() => this.remove(), 100); // 0.1초 후 삭제
        });

        container.appendChild(target);
      }

      // 1초마다 새로운 타겟이 사방에서 생성됨
      setInterval(spawnTarget, 1000);
    </script>
  </a-scene>
</body>
</html>
